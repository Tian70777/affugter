from fastapi.responses import HTMLResponse


@router.get("/debug", response_class=HTMLResponse)
async def debug_page():
    return """
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humidifier Control</title>
</head>
<body>
    <h1>Humidifier Control</h1>

    <h2>Fixed tests</h2>

    <button onclick="post('/debug/test/high_price')">
        High price
    </button>

    <button onclick="post('/debug/test/low_price')">
        Low price
    </button>

    <button onclick="post('/debug/test/high_humidity')">
        High humidity
    </button>

    <button onclick="post('/debug/test/low_humidity')">
        Low humidity
    </button>

    <button onclick="post('/debug/test/real')">
        Real values
    </button>

    <button onclick="post('/debug/test/on')">
        Shelly ON
    </button>

    <button onclick="post('/debug/test/off')">
        Shelly OFF
    </button>

    <button onclick="post('/debug/test/server_based')">
        Start server-based control
    </button>

    <button onclick="post('/debug/test/server_based/stop')">
        Stop server-based control
    </button>


    <h2>Humidity</h2>

    <input id="humidity" type="number" step="0.1">
    <button onclick="postValue('/debug/test/humidity/', 'humidity')">
        Test humidity
    </button>


    <h2>Electricity price</h2>

    <input id="price" type="number" step="0.01">
    <button onclick="postValue('/debug/test/price/', 'price')">
        Test price
    </button>


    <h2>Custom test</h2>

    <label>
        Humidity:
        <input id="custom-humidity" type="number" step="0.1">
    </label>

    <label>
        Price:
        <input id="custom-price" type="number" step="0.01">
    </label>

    <button onclick="postCustom()">
        Run custom test
    </button>


    <h2>Response</h2>
    <pre id="response">No request sent yet.</pre>


    <script>
        async function post(url) {
            const response = await fetch(url, {
                method: "POST"
            });

            await showResponse(response);
        }


        async function postValue(baseUrl, inputId) {
            const value = document.getElementById(inputId).value;

            const response = await fetch(
                baseUrl + encodeURIComponent(value),
                {
                    method: "POST"
                }
            );

            await showResponse(response);
        }


        async function postCustom() {
            const humidity =
                document.getElementById("custom-humidity").value;

            const price =
                document.getElementById("custom-price").value;

            const response = await fetch(
                "/debug/test/custom/"
                + encodeURIComponent(humidity)
                + "/"
                + encodeURIComponent(price),
                {
                    method: "POST"
                }
            );

            await showResponse(response);
        }


        async function showResponse(response) {
            const output = document.getElementById("response");

            const text = await response.text();

            try {
                const data = JSON.parse(text);
                output.textContent =
                    JSON.stringify(data, null, 2);
            } catch {
                output.textContent = text;
            }
        }
    </script>
</body>
</html>
    """
